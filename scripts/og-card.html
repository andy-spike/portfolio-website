<!doctype html>
<!--
  Source of truth for public/og-en.png and public/og-es.png.

  These are the arrival block at another magnification, so they are generated
  from the same words and the same print-shop kit rather than drawn by hand.
  To regenerate: open this file, set the viewport to exactly 1200x630 at 2x
  device scale, add ?locale=es for the Spanish card, and screenshot.
  Re-run it whenever the claim changes — a stale card is a wrong claim.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social card</title>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque Variable";
        src: url("../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2")
          format("woff2-variations");
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: block;
      }

      @font-face {
        font-family: "Azeret Mono Variable";
        src: url("../node_modules/@fontsource-variable/azeret-mono/files/azeret-mono-latin-wght-normal.woff2")
          format("woff2-variations");
        font-weight: 100 900;
        font-display: block;
      }

      /* The paper plate, matching the tokens in src/styles/global.css. */
      :root {
        --ground: #f6f1e7;
        --paper: #fffdf6;
        --ink: #16130d;
        --ink-muted: #57503f;
        --line-1: #f5b301;
        --line-2: #f4602a;
        --line-3: #2fbfae;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: var(--ground);
        color: var(--ink);
        font-family: "Bricolage Grotesque Variable", sans-serif;
        font-synthesis-weight: none;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 52px 60px;
        overflow: hidden;
      }

      /* The name plate, as it is set on the fascia: solid ink on paper. */
      .plate {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        padding: 8px 14px;
        background: var(--ink);
        color: var(--paper);
        border: 3px solid var(--ink);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        line-height: 1;
      }

      .claim {
        font-size: 82px;
        line-height: 1;
        letter-spacing: -0.03em;
        font-weight: 800;
        font-stretch: 85%;
        text-wrap: balance;
        max-width: 17ch;
      }

      /* The one word the claim turns on, set as a printed highlight. */
      .claim .lit {
        display: inline-block;
        background: var(--line-1);
        border: 3px solid var(--ink);
        padding: 0 0.14em;
        box-shadow: 4px 4px 0 var(--ink);
      }

      .projects {
        display: flex;
        gap: 28px;
      }

      .project {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .project .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: 2px solid var(--ink);
        font-family: "Azeret Mono Variable", monospace;
        font-size: 14px;
        font-weight: 700;
      }

      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
        border-top: 3px solid var(--ink);
        padding-top: 24px;
      }

      .legend {
        font-family: "Azeret Mono Variable", monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
    </style>
  </head>

  <body>
    <span class="plate">Andrés&nbsp;Sanabria</span>

    <h1 class="claim" data-slot="claim"></h1>

    <div class="foot">
      <div class="projects">
        <span class="project">
          <span class="chip" style="background: var(--line-1)">01</span>Dolphin
        </span>
        <span class="project">
          <span class="chip" style="background: var(--line-2)">02</span>Armin
        </span>
        <span class="project">
          <span class="chip" style="background: var(--line-3)">03</span>Citadela
        </span>
      </div>
      <span class="legend" data-slot="role"></span>
    </div>

    <script>
      // The same runs as showingLine(locale) in src/i18n/ui.ts, with the same
      // word marked. Kept literal so this file stays openable on its own,
      // with no build step.
      const LINES = {
        en: ["I build web products with ", "AI agents", " built-in."],
        es: ["Construyo productos web con ", "agentes de IA", " integrados."],
      };

      const ROLE = {
        en: "AI Product Engineer · Bogotá",
        es: "Ingeniero de producto de IA · Bogotá",
      };

      const locale =
        new URLSearchParams(location.search).get("locale") === "es"
          ? "es"
          : "en";
      document.documentElement.lang = locale;
      document.querySelector('[data-slot="role"]').textContent = ROLE[locale];

      const [head, lit, tail] = LINES[locale];
      const claim = document.querySelector('[data-slot="claim"]');
      claim.append(
        head,
        Object.assign(document.createElement("span"), {
          className: "lit",
          textContent: lit,
        }),
        tail,
      );
    </script>
  </body>
</html>
